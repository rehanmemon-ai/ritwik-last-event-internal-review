ual_review_status===status)&&(!role||asset.suggested_reel_role===role)&&(!decisionFilter||decision===decisionFilter)});$('count').textContent=`Showing ${shown.length} of ${assets.length} assets`;$('cards').innerHTML=shown.map(asset=>{const decision=decisions[asset.asset_id]||{};return `<article class="card"><img src="${esc(asset.preview_path)}" alt="Generated review preview for ${esc(asset.asset_id)}: ${esc(asset.visual_description)}"><div class="inside"><div class="id">${esc(asset.asset_id)}</div><span class="badge">${esc(asset.media_type)}</span><span class="badge">${esc(asset.visual_review_status)}</span><span class="badge">${esc(asset.suggested_reel_role)}</span><p><strong>Visible preview</strong><br>${esc(asset.visual_description)}</p><p><strong>Safe tags</strong><br>${esc(asset.safe_tags)}</p><p class="notice"><strong>Context limit</strong><br>${esc(asset.visual_rationale)}</p><div class="fields"><label>Human decision<select data-id="${esc(asset.asset_id)}" data-field="decision">${['Not reviewed','Shortlist for review','Needs clarification','Do not use','Approved for review'].map(value=>`<option ${(decision.decision||'Not reviewed')===value?'selected':''}>${value}</option>`).join('')}</select></label><label>Reviewer<input data-id="${esc(asset.asset_id)}" data-field="reviewer" value="${esc(decision.reviewer||'')}"></label><label>Review date<input type="date" data-id="${esc(asset.asset_id)}" data-field="review_date" value="${esc(decision.review_date||'')}"></label><label>Notes<textarea data-id="${esc(asset.asset_id)}" data-field="notes">${esc(decision.notes||'')}</textarea></label></div></div></article>`}).join('')||'<div class="empty">No matching assets.</div>';document.querySelectorAll('[data-id]').forEach(element=>element.addEventListener('input',event=>{const id=event.target.dataset.id;decisions[id]??={};decisions[id][event.target.dataset.field]=event.target.value;localStorage.setItem(storageKey,JSON.stringify(decisions));render()}))}['q','status','role','decisionFilter'].forEach(id=>$(id).addEventListener('input',render));$('download').addEventListener('click',()=>{const rows=[['asset_id','decision','reviewer','review_date','notes'],...assets.map(asset=>{const decision=decisions[asset.asset_id]||{};return[asset.asset_id,decision.decision||'Not reviewed',decision.reviewer||'',decision.review_date||'',decision.notes||'']})];const csv=rows.map(row=>row.map(value=>'"'+String(value).replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='last-event-review-decisions.csv';link.click();URL.revokeObjectURL(link.href)});render()</script></body></html>
